[project]
name = "agentive-backend"
version = "0.1.0"
description = "Agentive backend — Company Builder for AI agents (FastAPI + LangGraph + pgvector)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "bcrypt>=4.3",
    "cryptography>=46.0.7",
    "fastapi>=0.136.0",
    # Story 3.6 T5.1 — le blocage documenté ci-dessus (pas de wheel cp314 pour
    # la dépendance transitoire `py-rust-stemmers`) est LEVÉ : vérifié en
    # direct le 2026-09-08 via `pip download --python-version 3.14
    # --only-binary=:all: --platform manylinux_2_28_x86_64` (résolution PyPI
    # pure, sans toolchain Rust) — `fastembed==0.8.0` et toute sa chaîne
    # (onnxruntime, tokenizers, py-rust-stemmers, mmh3, pillow, numpy) ont des
    # wheels cp314/abi3 manylinux disponibles.
    "fastembed>=0.8",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=1.1.14",
    # ━━━ LangGraph version policy (Story 1.2 / Architecture G3) ━━━
    # Pinning STRICT obligatoire : toute mise à jour majeure (1.x → 2.x) ou tout
    # breaking change documenté CHANGELOG REQUIERT de relancer le spike Story 1.2
    # (`make spike-m3 && pytest tests/spike/`) et de mettre à jour
    # `docs/decisions/m3-spike-result.md` AVANT merge.
    # Validation : 3 piliers (checkpoint Postgres, scatter-gather, HITL) restent
    # fonctionnels après l'upgrade.
    "langgraph==1.1.8",
    # Pinned with langgraph (G3) — un saver Postgres qui change de version peut
    # casser le format checkpoint sans déclencher le bump de langgraph lui-même.
    "langgraph-checkpoint-postgres==3.0.5",
    "mcp>=1.27.0",
    # Story 2.7 fix-batch (C-01, 2026-09-02) : already a transitive dep of
    # langsmith[otel] (via langgraph) in uv.lock's graph, but NOT part of
    # this project's resolved/installed set (`from opentelemetry import
    # trace` raised ModuleNotFoundError before this line). Declared
    # directly per direct usage in playground/service.py (AC2 span
    # attribute). API-only package (no SDK/exporter) : `set_attribute` on
    # `get_current_span()` is a safe no-op when no tracer provider is
    # configured, so this stays inert until Story 9.x wires a real one.
    "opentelemetry-api>=1.41.0",
    "pgvector>=0.4.2",
    "prometheus-client>=0.20",
    # ━━━ psycopg version policy (Story 1.4 / event_bus LISTEN/NOTIFY) ━━━
    # Pin >=3.2.10 strict : versions 3.2.4 → 3.2.9 ont un memory leak dans
    # `AsyncConnection.notifies()` quand le générateur n'est pas régulièrement
    # consommé (https://github.com/psycopg/psycopg/issues/962, fix 3.2.10).
    # Le worker outbox.OutboxWorker dépend de notifies() — toute upgrade > 3.3
    # DOIT être validée sous charge (script publiant 1000 events/s pendant 5min,
    # vérifier que le RSS du process ne croît pas) avant merge.
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    # Story 2.1 — used to load `features/agent_registry/templates/archetype-schema.yaml`.
    # Already a transitive dep (langgraph), now declared explicitly per direct usage.
    "pyyaml>=6.0",
    # slowapi retiré (audit A-04 2026-07) : déclaré depuis le scaffolding mais
    # jamais câblé (aucun Limiter/@limit dans src/). Dépendance morte = surface
    # supply-chain inutile. Le rate limiting sera réintroduit AVEC son design
    # (par-endpoint, storage partagé) en Story 9.5 — prérequis multi-user.
    "sqlalchemy[asyncio]>=2.0.49",
    "sse-starlette>=3.3.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
    # Story 3.6 T5.1 — Embedding Router "voyage" backend (optional, cf. Dev
    # Notes § Scope Voyage). Wheel cp314 vérifié disponible le 2026-09-08.
    "voyageai>=0.5",
]

[project.scripts]
agentive-backend = "agentive_backend.app.main:serve"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Tool configurations
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
# `.uv-cache/` vit dans WORKDIR (`/app`) depuis le commit 21b2eff (fix EACCES
# sur l'user non-root en prod). Ruff exclut par défaut .mypy_cache / .ruff_cache
# / .pytest_cache mais pas .uv-cache, donc `ruff check .` walk dans les deps
# tierces et signale leurs warnings/erreurs comme s'ils étaient à nous.
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "C90",  # mccabe — cyclomatic complexity gate (audit A-15/B-01)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

# Audit A-15 (B-01) — gate de complexité cyclomatique via ruff/mccabe (déjà
# dans la toolchain, contrairement à radon/xenon proposés par l'audit).
# État au 2026-07-09 : max mesuré = 15 (`shared/llm/router.py::complete`),
# 6 fonctions entre 11 et 15. Seuil ratchet calé sur l'existant : ne PAS
# l'augmenter pour faire passer une nouvelle fonction — la découper. À
# resserrer (12 puis 10) au fil du refactoring SRP (audit A-09, Vague 2).
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "B", "N"]
"alembic/versions/*.py" = ["E", "W", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false  # FastAPI decorators
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

# `spike/` contient du code de validation isolé (Story 1.2). Il sera réécrit
# proprement dans `features/workflow_engine/` à l'Epic 4 — jusque là, on
# relâche mypy sur les retours de LangGraph (`StateGraph.compile()` retourne un
# type interne complexe qu'il n'est pas utile de propager dans les signatures
# du spike). Les tests `tests/spike/` valident la correction d'exécution.
[[tool.mypy.overrides]]
module = ["spike", "spike.*"]
ignore_errors = true

# `scripts/` contient le harness de benchmark M4 (Story 1.3) + restore-test +
# seed_dev. Code one-shot de mesure / outillage opérationnel — pas du code
# applicatif. Les retours psycopg `dict_row` et numpy arrays nécessiteraient
# énormément de cast/Protocol pour satisfaire mypy strict alors que la
# correction d'exécution est validée par `tests/scripts/` + l'exécution
# directe via `make bench`. Même pattern que `spike/` (Story 1.2).
[[tool.mypy.overrides]]
module = ["scripts", "scripts.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/agentive_backend"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: integration tests (require database)",
    "slow: tests that take more than 1s",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["src/agentive_backend"]
omit = ["*/tests/*", "*/__init__.py"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Note: import-linter contracts sont définis UNIQUEMENT dans `.import-linter`
# à la racine du repo (source unique de vérité). Invocation depuis backend/ :
#   uv run lint-imports --config ../.import-linter
# Invocation depuis la racine :
#   uv run --directory backend lint-imports --config .import-linter

[dependency-groups]
dev = [
    "cyclonedx-bom>=5",
    "import-linter>=2.11",
    "langgraph-cli[inmem]>=0.4.23",
    "mypy>=1.20.1",
    "polyfactory>=3.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "testcontainers>=4.14.2",
    "types-pyyaml>=6.0",  # Story 2.1 — mypy stubs for `import yaml`.
]
