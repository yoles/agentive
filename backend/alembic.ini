[alembic]
script_location = alembic
prepend_sys_path = src
# Required by Alembic 1.18+ to silence the legacy-splitting deprecation
# warning. ``os`` uses os.pathsep (':' on Linux/macOS, ';' on Windows).
path_separator = os
version_path_separator = os
timezone = UTC
revision_environment = false

# La DATABASE_URL est lue depuis shared.config.settings.database_url_owner
# (pas de sqlalchemy.url ici, injecté dans env.py)

[post_write_hooks]
# Formatage automatique post-génération (via ruff)
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
