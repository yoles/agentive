owRepo direct). Tech-debt nouveau D28 : index sur agent_instances.workflow_run_id (volume négligeable Sprint 1, ajouter si benchmarks Sprint 2 N+1). Epic 2 reste in-progress (4 stories backlog post-2.4 : 2.5 → 2.8).
