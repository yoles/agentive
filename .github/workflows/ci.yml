name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tout s'exécute via Docker — aucun runtime installé sur le runner GitHub Actions
# (les runners ont Docker préinstallé, conforme à la contrainte "Docker-first")

jobs:

  # ─── Lint ───
  lint-backend:
    name: Lint backend (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff check (via Docker)
        run: |
          docker run --rm -v $PWD/backend:/app -w /app python:3.14-slim sh -c "
            pip install --quiet --no-cache-dir --root-user-action=ignore uv &&
            uv sync --frozen &&
            uv run ruff check .
          "
      - name: Run ruff format check (via Docker)
        run: |
          docker run --rm -v $PWD/backend:/app -w /app python:3.14-slim sh -c "
            pip install --quiet --no-cache-dir --root-user-action=ignore uv &&
            uv sync --frozen &&
            uv run ruff format --check .
          "
      - name: Run mypy (via Docker)
        run: |
          docker run --rm -v $PWD/backend:/app -w /app python:3.14-slim sh -c "
            pip install --quiet --no-cache-dir --root-user-action=ignore uv &&
            uv sync --frozen &&
            uv run mypy src/
          "
      - name: Run import-linter (via Docker)
        run: |
          docker run --rm -v $PWD/backend:/app -v $PWD/.import-linter:/.import-linter:ro -w /app python:3.14-slim sh -c "
            pip install --quiet --no-cache-dir --root-user-action=ignore uv &&
            uv sync --frozen &&
            uv run lint-imports --config /.import-linter
          "

  lint-frontend:
    name: Lint frontend (eslint + tsc noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm ci (via Docker)
        run: |
          docker run --rm -v $PWD/frontend:/app -w /app node:24-alpine sh -c "npm ci"
      - name: ESLint (via Docker)
        run: |
          docker run --rm -v $PWD/frontend:/app -w /app node:24-alpine sh -c "npm run lint"
      - name: TSC noEmit (via Docker)
        run: |
          docker run --rm -v $PWD/frontend:/app -w /app node:24-alpine sh -c "npx tsc --noEmit"

  # ─── Secrets scan ───
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v $PWD:/src zricethezav/gitleaks:latest detect --source="/src" --no-banner -v

  # ─── Tests ───
  test-backend:
    name: Test backend (pytest + testcontainers)
    runs-on: ubuntu-latest
    services:
      docker:
        # docker-in-docker pour testcontainers — pas nécessaire sur GHA (Docker préinstallé)
        image: docker:dind
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest (via Docker)
        run: |
          docker run --rm \
            -v $PWD/backend:/app \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /app \
            python:3.14-slim sh -c "
              pip install --quiet --no-cache-dir --root-user-action=ignore uv &&
              uv sync --frozen &&
              uv run pytest --tb=short
            "

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run vitest (via Docker)
        run: |
          docker run --rm -v $PWD/frontend:/app -w /app node:24-alpine sh -c "
            npm ci &&
            npm run test -- --run
          "

  # ─── Build ───
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t agentive-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t agentive-frontend:ci ./frontend
