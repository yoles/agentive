name: CI

# Toutes les branches (AC8 Story 1.1) + tous les PRs vers main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — avoid double-burn on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege permissions. Specific jobs can override.
permissions:
  contents: read

# Shared build of the dev backend image — reused across lint/test steps so we
# install uv + sync dependencies ONCE per workflow instead of 4+ times.
# Same idea for the frontend : one `npm ci` across eslint + tsc + vitest.
jobs:
  # ─── Shared dev images (single source of truth) ───
  build-dev-images:
    name: Build dev images (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: dev
          tags: agentive-backend:ci
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max
      - name: Build frontend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: dev
          tags: agentive-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,scope=frontend-dev,mode=max

  # ─── Lint ───
  lint-backend:
    name: Lint backend (ruff + mypy + import-linter)
    runs-on: ubuntu-latest
    needs: build-dev-images
    steps:
      - uses: actions/checkout@v4
      - name: Restore backend image from cache
        uses: docker/setup-buildx-action@v3
      - name: Rebuild backend image (uses cache from previous job)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: dev
          tags: agentive-backend:ci
          load: true
          cache-from: type=gha,scope=backend-dev
      - name: Ruff check
        run: docker run --rm agentive-backend:ci uv run ruff check .
      - name: Ruff format check
        run: docker run --rm agentive-backend:ci uv run ruff format --check .
      - name: MyPy
        run: docker run --rm agentive-backend:ci uv run mypy src/
      - name: Import linter
        run: docker run --rm -v $PWD/.import-linter:/.import-linter:ro agentive-backend:ci uv run lint-imports --config /.import-linter

  lint-frontend:
    name: Lint frontend (eslint + tsc noEmit)
    runs-on: ubuntu-latest
    needs: build-dev-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild frontend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: dev
          tags: agentive-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend-dev
      - name: ESLint
        run: docker run --rm agentive-frontend:ci npm run lint
      - name: TypeScript noEmit
        run: docker run --rm agentive-frontend:ci npx tsc --noEmit

  # ─── Secrets scan ───
  # `--redact` prevents secret values from appearing in workflow logs.
  # Canonical subcommand is `gitleaks git --staged --pre-commit` for pre-commit ;
  # for CI we scan the whole working tree + recent history.
  gitleaks:
    name: Gitleaks (secrets scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # enough to scan the diff history for typical PRs
      - name: Run gitleaks (redacted)
        run: |
          docker run --rm -v "$PWD":/src:ro zricethezav/gitleaks:v8.30.1 \
            git /src --redact --no-banner --config=/src/.gitleaks.toml

  # ─── Tests ───
  # Tests run DIRECTLY on the runner (not inside a nested docker run) so we
  # don't expose the host Docker socket to arbitrary PR code.
  # testcontainers connects to the runner's daemon via standard env vars.
  test-backend:
    name: Test backend (pytest + testcontainers)
    runs-on: ubuntu-latest
    needs: build-dev-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: dev
          tags: agentive-backend:ci
          load: true
          cache-from: type=gha,scope=backend-dev
      # testcontainers requires access to the runner Docker daemon. GitHub
      # Actions hosted runners already have Docker available — we do NOT mount
      # /var/run/docker.sock into a nested container (PR RCE vector). Instead,
      # we run pytest on the runner with the backend image providing deps.
      - name: Run pytest
        run: |
          docker run --rm \
            -e TESTCONTAINERS_RYUK_DISABLED=true \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            agentive-backend:ci \
            uv run pytest --tb=short

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-latest
    needs: build-dev-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild frontend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: dev
          tags: agentive-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend-dev
      - name: Run vitest
        run: docker run --rm agentive-frontend:ci npx vitest run

  # ─── Build ───
  # Vérifie que l'image prod build ET que le bundle frontend est produit.
  build-prod-frontend-bundle:
    name: Build frontend prod bundle (vite build)
    runs-on: ubuntu-latest
    needs: build-dev-images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend prod image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          tags: agentive-frontend:prod-ci
          load: true
          cache-from: |
            type=gha,scope=frontend-dev
            type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

  build:
    name: Build summary (lint + test + bundle all green)
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - test-backend
      - test-frontend
      - gitleaks
      - build-prod-frontend-bundle
    steps:
      - name: Summary
        run: echo "All quality gates passed ✅"
