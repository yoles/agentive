# Agentive — Docker Compose (dev stack)
# Ports dev : Caddy 8080/8443 (prod : 80/443 via docker-compose.prod.yml)

services:

  # ─── Postgres 17 + pgvector (image officielle) ───
  db:
    image: pgvector/pgvector:pg17
    container_name: agentive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-change_me_owner_dev}
      POSTGRES_DB: agentive
      # Passwords pour les rôles app/audit_admin/owner (consommés par init.sql)
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-change_me_owner_dev}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change_me_app_dev}
      POSTGRES_AUDIT_ADMIN_PASSWORD: ${POSTGRES_AUDIT_ADMIN_PASSWORD:-change_me_audit_dev}
    ports:
      - "127.0.0.1:5432:5432"  # Bind localhost only
    volumes:
      - agentive_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentive"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - agentive-net

  # ─── Backend FastAPI + uv ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: agentive-backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENTIVE_API_TOKEN: ${AGENTIVE_API_TOKEN:-change_me_dev_token}
      AGENTIVE_ENCRYPTION_KEY: ${AGENTIVE_ENCRYPTION_KEY:-change_me_fernet_key}
      DATABASE_URL: "postgresql+psycopg://agentive_app:${POSTGRES_APP_PASSWORD:-change_me_app_dev}@db:5432/agentive"
      DATABASE_URL_OWNER: "postgresql+psycopg://agentive_owner:${POSTGRES_OWNER_PASSWORD:-change_me_owner_dev}@db:5432/agentive"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - agentive-net

  # ─── Frontend Vite dev server ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: agentive-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000
      VITE_AGENTIVE_API_TOKEN: ${AGENTIVE_API_TOKEN:-change_me_dev_token}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - agentive-net

  # ─── Caddy reverse proxy (ports dev 8080/8443) ───
  caddy:
    image: caddy:2-alpine
    container_name: agentive-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_DEV_HTTP_PORT:-8080}:80"
      - "${CADDY_DEV_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - agentive_caddy_data:/data
      - agentive_caddy_config:/config
    depends_on:
      - backend
      - frontend
    healthcheck:
      # TCP port 80 accepté = Caddy alive (no HTTP parsing — plus robuste vs BusyBox)
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agentive-net

volumes:
  agentive_db_data:
  agentive_caddy_data:
  agentive_caddy_config:
  backend_venv:
  frontend_node_modules:

networks:
  agentive-net:
    driver: bridge
